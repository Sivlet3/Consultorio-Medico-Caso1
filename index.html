<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Prototipo modular del Consultorio Salud Integral.">
    <title>Consultorio Salud Integral</title>
    <link rel="stylesheet" href="styles/app.css">
  </head>
  <body>
    <main class="application-shell">
      <header class="application-header">
        <p class="eyebrow">Prototipo modular</p>
        <h1>Consultorio Salud Integral</h1>
        <p>Consulta cada flujo funcional de forma independiente o visualiza el tablero completo.</p>
      </header>

      <section class="screen-controls" aria-label="Controles de visualización">
        <label for="screen-selector">Pantalla</label>
        <select id="screen-selector"></select>
        <button id="toggle-all" class="control-button" type="button" aria-pressed="false">
          Mostrar todas
        </button>
      </section>

      <nav id="screen-navigation" class="screen-navigation" aria-label="Navegación de pantallas"></nav>
      <section id="screen-output" class="screen-output" aria-live="polite"></section>
    </main>

    <noscript>Esta aplicación necesita JavaScript para mostrar las pantallas del prototipo.</noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
